<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>20 Questions: Video Game Guesser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: #0b0f19;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 800px;
      background: #111827;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #1f2937;
    }
    h1 { margin-top: 0; }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    .yes { background: #4ade80; }
    .no { background: #f87171; }
    .restart { background: #1f2937; color: #e5e7eb; }
    .question-box {
      background: #1f2937;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="app">
  <h1>20 Questions: Video Game Guesser</h1>
  <p>Think of a video game. I’ll try to guess it in 20 questions.</p>

  <div class="question-box">
    <div id="question-label" style="opacity:0.7; font-size:14px;">Warm‑up</div>
    <div id="question-text" style="font-size:20px; margin-top:6px;">
      Click “Start” to begin.
    </div>
    <div id="guess-box" class="hidden" style="margin-top:12px;">
      <strong>I think your game is:</strong>
      <div id="guess-title" style="font-size:22px; color:#38bdf8; margin-top:4px;"></div>
    </div>
  </div>

  <div style="display:flex; gap:10px; margin-bottom:10px;">
    <button class="yes" id="btn-yes">Yes</button>
    <button class="no" id="btn-no">No</button>
    <button class="restart" id="btn-restart">Start / Restart</button>
  </div>

  <div style="opacity:0.7; font-size:14px;">
    Question <span id="qcount">0</span> / 20  
    • Candidates: <span id="ccount">–</span>
  </div>
</div>

<script>
/* ============================================================
   LOAD DATASET
============================================================ */
let ALL_GAMES = [];

async function loadGames() {
  const res = await fetch("games.json");
  ALL_GAMES = await res.json();
  document.getElementById("ccount").textContent = ALL_GAMES.length;
}
loadGames();

/* ============================================================
   GAME STATE
============================================================ */
const MAX_Q = 20;
let remaining = [];
let asked = new Set();
let qcount = 0;
let currentQ = null;

/* ============================================================
   HIGH‑DEPTH QUESTION SET (20 QUESTIONS)
   These are tuned for Option‑B schema.
============================================================ */
const QUESTIONS = [
  {
    id: "genre_fps",
    label: "Genre",
    text: "Is your game primarily a first-person shooter?",
    pred: g => g.genre === "fps" || g.subgenre.includes("shooter") || g.tags.includes("shooter")
  },
  {
    id: "genre_rpg",
    label: "Genre",
    text: "Does your game have strong RPG elements?",
    pred: g => g.genre.includes("rpg") || g.tags.includes("soulslike") || g.tags.includes("fantasy")
  },
  {
    id: "genre_platformer",
    label: "Genre",
    text: "Is your game a platformer?",
    pred: g => g.genre === "platformer" || g.tags.includes("platformer")
  },
  {
    id: "sub_openworld",
    label: "World",
    text: "Is your game open-world?",
    pred: g => g.subgenre.includes("open-world") || g.tags.includes("open-world")
  },
  {
    id: "perspective_fp",
    label: "Perspective",
    text: "Is your game played from a first-person perspective?",
    pred: g => g.perspective === "first-person"
  },
  {
    id: "perspective_tp",
    label: "Perspective",
    text: "Is your game played from a third-person perspective?",
    pred: g => g.perspective === "third-person"
  },
  {
    id: "multiplayer",
    label: "Multiplayer",
    text: "Does your game support multiplayer?",
    pred: g => g.multiplayer
  },
  {
    id: "online",
    label: "Online",
    text: "Does your game support online play?",
    pred: g => g.online
  },
  {
    id: "coop",
    label: "Co-op",
    text: "Does your game support co-op gameplay?",
    pred: g => g.coop
  },
  {
    id: "indie",
    label: "Production",
    text: "Is your game considered an indie game?",
    pred: g => g.tags.includes("indie")
  },
  {
    id: "horror",
    label: "Tone",
    text: "Does your game include horror elements?",
    pred: g => g.tags.includes("horror")
  },
  {
    id: "fantasy",
    label: "Tone",
    text: "Is your game set in a fantasy world?",
    pred: g => g.tags.includes("fantasy")
  },
  {
    id: "scifi",
    label: "Tone",
    text: "Is your game science-fiction themed?",
    pred: g => g.tags.includes("sci-fi")
  },
  {
    id: "metacritic90",
    label: "Critical acclaim",
    text: "Does your game have a Metacritic score above 90?",
    pred: g => g.metacritic >= 90
  },
  {
    id: "year_recent",
    label: "Release",
    text: "Was your game released after 2015?",
    pred: g => g.year > 2015
  },
  {
    id: "year_old",
    label: "Release",
    text: "Was your game released before 2005?",
    pred: g => g.year < 2005
  },
  {
    id: "gen8plus",
    label: "Console generation",
    text: "Is your game primarily from console generation 8 or newer?",
    pred: g => g.console_generation >= 8
  },
  {
    id: "long_campaign",
    label: "Length",
    text: "Does your game have a long campaign (over 30 hours)?",
    pred: g => g.campaign_length_hours >= 30
  },
  {
    id: "popular",
    label: "Popularity",
    text: "Is your game among the top 200 best-selling games?",
    pred: g => g.best_seller_rank <= 200
  },
  {
    id: "publisher_nintendo",
    label: "Publisher",
    text: "Was your game published by Nintendo?",
    pred: g => g.publisher === "Nintendo"
  }
];

/* ============================================================
   ENTROPY‑BASED QUESTION SELECTION
============================================================ */
function entropy(p) {
  if (p <= 0 || p >= 1) return 0;
  return -p * Math.log2(p) - (1 - p) * Math.log2(1 - p);
}

function chooseBestQuestion() {
  let best = null;
  let bestScore = -Infinity;

  for (const q of QUESTIONS) {
    if (asked.has(q.id)) continue;

    let yes = 0, no = 0;
    for (const g of remaining) {
      if (q.pred(g)) yes++; else no++;
    }
    if (yes === 0 || no === 0) continue;

    const p = yes / (yes + no);
    const score = entropy(p);
    if (score > bestScore) {
      bestScore = score;
      best = q;
    }
  }
  return best;
}

/* ============================================================
   GAME LOOP
============================================================ */
function askNext() {
  document.getElementById("qcount").textContent = qcount;
  document.getElementById("ccount").textContent = remaining.length;

  if (remaining.length === 0) {
    showGuess("No matching game found");
    return;
  }

  if (remaining.length === 1 || qcount >= MAX_Q) {
    showGuess(remaining[0].name);
    return;
  }

  const q = chooseBestQuestion();
  if (!q) {
    showGuess(remaining[0].name);
    return;
  }

  currentQ = q;
  document.getElementById("question-label").textContent = q.label;
  document.getElementById("question-text").textContent = q.text;
}

function showGuess(name) {
  document.getElementById("guess-title").textContent = name;
  document.getElementById("guess-box").classList.remove("hidden");
  document.getElementById("question-label").textContent = "My guess";
  document.getElementById("question-text").textContent = "";
}

/* ============================================================
   EVENT HANDLERS
============================================================ */
document.getElementById("btn-restart").onclick = () => {
  remaining = [...ALL_GAMES];
  asked.clear();
  qcount = 1;
  currentQ = QUESTIONS[0];
  document.getElementById("guess-box").classList.add("hidden");
  document.getElementById("question-label").textContent = currentQ.label;
  document.getElementById("question-text").textContent = currentQ.text;
  asked.add(currentQ.id);
  document.getElementById("qcount").textContent = 1;
  document.getElementById("ccount").textContent = remaining.length;
};

document.getElementById("btn-yes").onclick = () => {
  if (!currentQ) return;
  remaining = remaining.filter(g => currentQ.pred(g));
  asked.add(currentQ.id);
  qcount++;
  askNext();
};

document.getElementById("btn-no").onclick = () => {
  if (!currentQ) return;
  remaining = remaining.filter(g => !currentQ.pred(g));
  asked.add(currentQ.id);
  qcount++;
  askNext();
};
</script>

</body>
</html>
